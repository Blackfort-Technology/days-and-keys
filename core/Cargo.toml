# SPDX-License-Identifier: MPL-2.0
[workspace]
resolver = "3"
members = ["crates/dak-core", "crates/dak-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
repository = "https://github.com/Blackfort-Technology/days-and-keys"
publish = false

[workspace.dependencies]
libsodium-sys-stable = { version = "=1.24.0", features = ["minimal"] }
zeroize = { version = "=1.9.0", features = ["derive"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
thiserror = "=2.0.21"
uniffi = "=0.32.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "unwind"
strip = "debuginfo"
