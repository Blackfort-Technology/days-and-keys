# SPDX-License-Identifier: MPL-2.0
# cargo-deny: Lieferkette (#68, AE-32)
[graph]
all-features = true

[advisories]
yanked = "deny"
# zip 8.x ist vollständig zurückgezogen, libsodium-sys-stable (auch 1.24.3) verlangt aber 8.6.
# Gebraucht nur im Build-Skript zum Entpacken der vorgebauten MSVC-Bibliothek (Windows), den
# Pfad durchläuft keines unserer Ziele. Ausnahme entfernen, sobald libsodium-sys-stable auf zip 9
# geht (#157).
ignore = [
    { crate = "zip@8.6.0", reason = "nur Windows-Build-Skript von libsodium-sys-stable, #157" },
    # Rechte und Symlinks beim Entpacken fremder Archive. Das Build-Skript entpackt nur bei
    # *-windows-msvc das mitgelieferte, per minisign geprüfte libsodium-Archiv (#163).
    { id = "RUSTSEC-2026-0367", reason = "zip nur im Windows-Build-Skript, geprüftes Archiv, #163" },
    { id = "RUSTSEC-2026-0368", reason = "zip nur im Windows-Build-Skript, geprüftes Archiv, #163" },
    { id = "RUSTSEC-2026-0369", reason = "zip nur im Windows-Build-Skript, geprüftes Archiv, #163" },
    { id = "RUSTSEC-2026-0429", reason = "zip nur im Windows-Build-Skript, geprüftes Archiv, #172" },
    # basic-toml ist nicht mehr gepflegt (keine Sicherheitslücke). Es kommt über askama in
    # uniffi_bindgen und läuft nur beim Erzeugen der Bindungen zur Bauzeit, nie in der App.
    # Kein sicheres Update verfügbar; entfernen, sobald uniffi askama ohne basic-toml nutzt (#172).
    { id = "RUSTSEC-2026-0374", reason = "basic-toml nur zur Bauzeit über uniffi_bindgen, #172" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "ISC", "BSD-2-Clause", "BSD-3-Clause", "MPL-2.0", "Unicode-3.0", "Zlib", "CC0-1.0", "Unlicense", "BlueOak-1.0.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # keine Telemetrie- oder Netzwerkpakete im Kern (AE-19, AE-21)
    { name = "reqwest" },
    { name = "hyper" },
    { name = "sentry" },
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
