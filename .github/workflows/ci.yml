# SPDX-License-Identifier: MPL-2.0
# CI für jeden Pull Request und jeden Stand auf main. Pflicht-Checks für den Merge:
# governance, sicherheit, kern (Branch-Schutz). Actions sind auf Commits gepinnt (#68).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Ohne ausdrückliches bash läuft GitHub ohne pipefail; ein Fehler vor `| tail` bliebe dann grün.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  GRADLE_VERSION: "9.7.1"
  NDK_VERSION: "29.0.14206865"
  BUNDLETOOL_VERSION: "1.18.3"
  BUNDLETOOL_SHA256: "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"

jobs:
  governance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pflichtdateien
        run: |
          for f in README.md ROADMAP.md CLAUDE.md SECURITY.md AUDITS.md LICENSE LICENSE-docs core/Cargo.lock; do
            test -f "$f" || { echo "Pflichtdatei fehlt: $f"; exit 1; }
          done
      - name: Jeder Commit und der PR-Titel referenzieren ein Issue
        env:
          PR_TITEL: ${{ github.event.pull_request.title }}
          BASIS: ${{ github.event.pull_request.base.sha || github.event.before }}
          KOPF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          fehler=0
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "${PR_TITEL}" | grep -Eq '#[0-9]+' || { echo "PR-Titel ohne Issue-Bezug"; fehler=1; }
          fi
          if [ -n "${BASIS}" ] && [ "${BASIS}" != "0000000000000000000000000000000000000000" ]; then
            while read -r sha; do
              git log -1 --format=%B "$sha" | grep -Eq '#[0-9]+' || { echo "Commit ohne Issue-Bezug: $sha"; fehler=1; }
            done < <(git rev-list --no-merges "${BASIS}..${KOPF}")
          fi
          exit $fehler
      - name: Keine langen Gedankenstriche in Texten
        run: |
          if grep -rnP '[\x{2013}\x{2014}]' --include='*.md' --include='*.rs' --include='*.kt' --include='*.swift' --include='*.json' --exclude=LICENSE --exclude=LICENSE-docs --exclude=dak_core.kt --exclude=DakKern.swift . ; then
            echo "Bitte nur den normalen Bindestrich verwenden."; exit 1
          fi

  sicherheit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks über die ganze Historie
        run: |
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-deny@0.19.9,cargo-audit@0.22.1
      - name: cargo-deny (Advisories, Lizenzen, verbotene Pakete, Quellen)
        working-directory: core
        run: cargo deny --locked check
      - name: cargo-audit
        working-directory: core
        run: cargo audit --deny warnings

  kern:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            core/target
          key: kern-${{ hashFiles('core/Cargo.lock', 'core/rust-toolchain.toml') }}
      - name: Toolchain (aus core/rust-toolchain.toml)
        working-directory: core
        run: rustup show active-toolchain || rustup toolchain install
      - name: Formatierung
        working-directory: core
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: core
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests und Testvektoren
        working-directory: core
        run: cargo test --locked --workspace
      - name: Lastprobe (zwei Jahre, zehn Status je Tag)
        working-directory: core
        run: cargo test --locked --release -p dak-core --test szenarien lastprobe -- --ignored --nocapture

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            core/target
            ~/.gradle/caches
          key: android-${{ hashFiles('core/Cargo.lock', 'android/**/*.kts') }}
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-ndk@4.1.2
      - name: Werkzeuge (NDK, SDK 37, Gradle und bundletool mit Prüfsumme)
        run: |
          printf 'y\n%.0s' $(seq 30) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
          curl -fsSL -o gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          echo "$(curl -fsSL https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip.sha256)  gradle.zip" | sha256sum -c -
          unzip -q gradle.zip -d "$RUNNER_TEMP" && echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          echo "${BUNDLETOOL_SHA256}  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
      - name: Bindungen sind aktuell (Kotlin und Swift aus dak-ffi)
        working-directory: core
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo build --locked -p dak-ffi --features bindgen
          ./target/debug/uniffi-bindgen generate --no-format --library target/debug/libdak_ffi.so --language kotlin --out-dir ../android/app/src/main/java
          ./target/debug/uniffi-bindgen generate --no-format --library target/debug/libdak_ffi.so --language swift --out-dir ../ios/Generated
          git diff --exit-code -- ../android/app/src/main/java ../ios/Generated
      - name: Kern für Android und für den JVM-Bindungstest
        working-directory: core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          cargo build --locked --release -p dak-ffi
          cargo ndk -t arm64-v8a -t x86_64 -P 33 -o ../android/app/src/main/jniLibs build --locked --release -p dak-ffi
      - name: Gradle (Bindungstest, Lint, APK, AAB)
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --console=plain --no-daemon testDebugUnitTest lintDebug assembleRelease bundleRelease
      - name: APK ohne INTERNET-Berechtigung (AE-19)
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions "$apk" | tee berechtigungen.txt
          if grep -q "android.permission.INTERNET" berechtigungen.txt; then echo "APK verlangt INTERNET"; exit 1; fi
      - name: AAB ohne INTERNET-Berechtigung, Paketname und versionCode wie die APK (#159)
        run: |
          bt=(java -jar "$RUNNER_TEMP/bundletool.jar")
          aab=android/app/build/outputs/bundle/release/app-release.aab
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "${bt[@]}" dump manifest --bundle="$aab" > aab-manifest.xml
          grep -q "<manifest" aab-manifest.xml || { echo "Manifest des AAB nicht lesbar"; exit 1; }
          if grep -q "android.permission.INTERNET" aab-manifest.xml; then echo "AAB verlangt INTERNET"; exit 1; fi
          paket=$("${bt[@]}" dump manifest --bundle="$aab" --xpath=/manifest/@package)
          aab_vc=$("${bt[@]}" dump manifest --bundle="$aab" --xpath=/manifest/@android:versionCode)
          apk_vc=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | sed -n "s/^package: .* versionCode='\([0-9]*\)'.*/\1/p")
          echo "Paket ${paket}, versionCode APK ${apk_vc:-fehlt}, AAB ${aab_vc:-fehlt}"
          [ "$paket" = "de.blackforttec.daysandkeys" ] || { echo "Paketname weicht ab"; exit 1; }
          test -n "$apk_vc" && [ "$aab_vc" = "$apk_vc" ] || { echo "versionCode weicht ab"; exit 1; }
      - name: Play-Upload-Skript (Abhängigkeiten nur mit Hashes, Offline-Test, #159)
        run: |
          python3 -m venv "$RUNNER_TEMP/play"
          "$RUNNER_TEMP/play/bin/pip" install --quiet --require-hashes --no-deps -r android/play/requirements.txt
          cd android/play && DAK_PLAY_DEPS=1 "$RUNNER_TEMP/play/bin/python" -m unittest -v test_play_upload
      - name: Nur freigegebene Komponenten exportiert (#116)
        run: |
          if python3 android/pruefung/exportierte_komponenten.py android/pruefung/negativ.xml; then
            echo "Gegenprobe: die Negativ-Fixture muss scheitern"; exit 1
          fi
          python3 android/pruefung/exportierte_komponenten.py android/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-unsigniert
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aab-unsigniert
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kern als XCFramework (Gerät und Simulator)
        working-directory: core
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          cargo build --locked --release -p dak-ffi --target aarch64-apple-ios
          cargo build --locked --release -p dak-ffi --target aarch64-apple-ios-sim
          mkdir -p kopf && cp ../ios/Generated/DakKernFFI.h kopf/ && cp ../ios/Generated/DakKernFFI.modulemap kopf/module.modulemap
          rm -rf ../ios/Frameworks && mkdir -p ../ios/Frameworks
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libdak_ffi.a -headers kopf \
            -library target/aarch64-apple-ios-sim/release/libdak_ffi.a -headers kopf \
            -output ../ios/Frameworks/DakKernFFI.xcframework
      - name: Projekt erzeugen und für den Simulator bauen
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project DaysAndKeys.xcodeproj -scheme DaysAndKeys -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:|failed|Undefined symbol|ld: |referenced from" -A3 build.log | head -300; exit 1; }
          grep -E "warning:" build.log | grep -v "Generated/" | head -50 || true
          tail -3 build.log
